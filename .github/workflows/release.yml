# Publish versioned linux/amd64 shared libraries to a GitHub Release.
# Separate from bazel-test.yml so unit tests stay fast.
#
# Artifacts (version = UTC calver YYYY.MM.DD, same as Engine Maven / ghcr tags):
#   libOpenBimRL-Engine-Native-x86_64-llvm-<version>.so
#   libOpenBimRL-Engine-Native-x86_64-rocm-<version>.so
#   libOpenBimRL-Engine-Native-x86_64-nvcc-<version>.so
#
# IfcOpenShell is compiled once (system clang on ubuntu-24.04) and reused by
# llvm / rocm / nvcc via the ifcopenshell-prefix artifact. Consumer jobs still
# install matching OCCT/dev packages from apt; only the IfcOpenShell compile
# is skipped. Stick to the ubuntu 24.04 family so glibc/libstdc++ match.
#
# After build-llvm, test-integration builds/runs CMake IFC gtests
# (test/integration) against the same IfcOpenShell prefix; release waits on it.
#
# In-jar Engine resource stays unversioned libOpenBimRL-Engine-Native-x86_64.so.
name: Release native shared libraries

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  IFCOPENSHELL_GIT_TAG: eafa158ca0cd5ba2ca22b5e588b0375cab2efbce
  OPENBIMRL_USE_PREBUILT_IFCOPENSHELL: "ON"
  OPENBIMRL_IFCOPENSHELL_PREFIX: /opt/ifcopenshell
  CUDA_HOME: /usr/local/cuda

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.v.outputs.value }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          value="$(date -u +%Y).$(date -u +%m).$(date -u +%d)"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "tag=v${value}" >> "$GITHUB_OUTPUT"

  # Shared prebuild: system clang + apt OCCT. Consumed by llvm/rocm/nvcc via
  # artifact (ROCm/CUDA clang not required for IfcOpenShell itself).
  build-ifcopenshell:
    runs-on: ubuntu-24.04
    steps:
      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libboost-all-dev \
            xfonts-scalable \
            libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libxml2-dev libeigen3-dev \
            cmake ninja-build make \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev libxt-dev \
            libtbb-dev tcl-dev tk-dev occt-misc
          clang++ --version

      - name: Build IfcOpenShell
        run: |
          set -euo pipefail
          IFCOS_PREFIX="${RUNNER_TEMP}/ifcopenshell"
          SRC="${RUNNER_TEMP}/IfcOpenShell"
          BUILD="${RUNNER_TEMP}/ifcos-build"
          rm -rf "${IFCOS_PREFIX}"
          mkdir -p "${IFCOS_PREFIX}"
          git clone --quiet https://github.com/IfcOpenShell/IfcOpenShell.git "${SRC}"
          git -C "${SRC}" checkout --quiet "${IFCOPENSHELL_GIT_TAG}"
          cmake -G Ninja -S "${SRC}/cmake" -B "${BUILD}" \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_INSTALL_PREFIX="${IFCOS_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOCC_INCLUDE_DIR=/usr/include/opencascade \
            -DOCC_LIBRARY_DIR=/usr/lib/x86_64-linux-gnu \
            -DBUILD_SHARED_LIBS=ON \
            -DSCHEMA_VERSIONS="2x3;4;4x3_add2" \
            -DBUILD_CONVERT=OFF \
            -DBUILD_IFCPYTHON=OFF \
            -DBUILD_GEOMSERVER=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCUMENTATION=OFF \
            -DWITH_CGAL=OFF \
            -DCOLLADA_SUPPORT=OFF \
            -DHDF5_SUPPORT=OFF \
            -DGLTF_SUPPORT=OFF \
            -DIFCXML_SUPPORT=OFF \
            -DUSD_SUPPORT=OFF
          cmake --build "${BUILD}" -j"$(nproc)"
          cmake --install "${BUILD}"
          sudo mkdir -p /opt
          sudo rm -rf /opt/ifcopenshell
          sudo cp -a "${IFCOS_PREFIX}" /opt/ifcopenshell

      - name: Package install prefix
        run: |
          set -euo pipefail
          tar -C /opt -czf ifcopenshell-prefix.tar.gz ifcopenshell
          ls -lh ifcopenshell-prefix.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ifcopenshell-prefix
          path: ifcopenshell-prefix.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-llvm:
    needs: [version, build-ifcopenshell]
    runs-on: ubuntu-24.04
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
    steps:
      - uses: actions/checkout@v5

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libomp-dev libomp5 \
            libboost-all-dev \
            xfonts-scalable \
            libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libxml2-dev libeigen3-dev \
            cmake ninja-build make \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev libxt-dev \
            libtbb-dev tcl-dev tk-dev occt-misc
          clang++ --version

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Download IfcOpenShell prefix
        uses: actions/download-artifact@v4
        with:
          name: ifcopenshell-prefix
          path: .

      - name: Install IfcOpenShell prefix
        run: |
          set -euo pipefail
          sudo mkdir -p /opt
          sudo rm -rf /opt/ifcopenshell
          sudo tar -C /opt -xzf ifcopenshell-prefix.tar.gz
          test -d /opt/ifcopenshell/include
          test -d /opt/ifcopenshell/lib

      - name: Bazel build shared library (llvm)
        run: bazel build //:openbimrl_native

      - name: Stage release asset
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          src="$(find -L bazel-bin -name 'libOpenBIMRL_Native.so' -type f | head -1)"
          if [[ -z "${src}" || ! -f "${src}" ]]; then
            echo "ERROR: libOpenBIMRL_Native.so not found under bazel-bin" >&2
            find -L bazel-bin -name '*.so' 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          mkdir -p dist
          dest="dist/libOpenBimRL-Engine-Native-x86_64-llvm-${VERSION}.so"
          cp -f "${src}" "${dest}"
          ls -la "${dest}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-so-llvm
          path: dist/*.so
          if-no-files-found: error

  # IFC integration gtests (test/integration) — CMake + prebuilt IfcOpenShell.
  # Anchored after build-llvm so the llvm .so path is proven first; reuses the
  # shared ifcopenshell-prefix artifact (no second IfcOpenShell compile).
  test-integration:
    needs: [build-llvm, build-ifcopenshell]
    runs-on: ubuntu-24.04
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      OPENBIMRL_USE_PREBUILT_IFCOPENSHELL: "ON"
      OPENBIMRL_IFCOPENSHELL_PREFIX: /opt/ifcopenshell
    steps:
      - uses: actions/checkout@v5

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libomp-dev libomp5 \
            libboost-all-dev \
            xfonts-scalable \
            libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libxml2-dev libeigen3-dev \
            cmake ninja-build make \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev libxt-dev \
            libtbb-dev tcl-dev tk-dev occt-misc
          clang++ --version

      - name: Download IfcOpenShell prefix
        uses: actions/download-artifact@v4
        with:
          name: ifcopenshell-prefix
          path: .

      - name: Install IfcOpenShell prefix
        run: |
          set -euo pipefail
          sudo mkdir -p /opt
          sudo rm -rf /opt/ifcopenshell
          sudo tar -C /opt -xzf ifcopenshell-prefix.tar.gz
          test -d /opt/ifcopenshell/include
          test -d /opt/ifcopenshell/lib

      - name: CMake configure (integration tests)
        run: |
          cmake -G Ninja -S . -B build-integration \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DOPENBIMRL_USE_PREBUILT_IFCOPENSHELL=ON \
            -DOPENBIMRL_IFCOPENSHELL_PREFIX=/opt/ifcopenshell \
            -DOPENBIMRL_BUILD_NATIVE_TESTS=ON

      - name: Build OpenBIMRL_Native_Test
        run: |
          # Ensure discovery/link can resolve libOpenBIMRL_Native.so in the build dir
          # (gtest_discover_tests may still probe the binary depending on CMake version).
          export LD_LIBRARY_PATH="${PWD}/build-integration:/opt/ifcopenshell/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cmake --build build-integration -j"$(nproc)" --target OpenBIMRL_Native_Test

      - name: Run IFC integration tests
        run: |
          export LD_LIBRARY_PATH="${PWD}/build-integration:/opt/ifcopenshell/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          ./build-integration/OpenBIMRL_Native_Test

  build-rocm:
    needs: [version, build-ifcopenshell]
    runs-on: ubuntu-24.04
    # ROCm LLVM for --config=rocm_offload. No GPU on runners — set arch for compile-only.
    env:
      OPENBIMRL_ROCM_OFFLOAD_ARCH: gfx1100
    container:
      image: rocm/dev-ubuntu-24.04:7.1.1
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Install apt dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            libboost-all-dev \
            xfonts-scalable \
            libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libxml2-dev libeigen3-dev \
            cmake ninja-build make \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev libxt-dev \
            libtbb-dev tcl-dev tk-dev occt-misc
          /opt/rocm/llvm/bin/clang++ --version

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Download IfcOpenShell prefix
        uses: actions/download-artifact@v4
        with:
          name: ifcopenshell-prefix
          path: .

      - name: Install IfcOpenShell prefix
        run: |
          set -euo pipefail
          mkdir -p /opt
          rm -rf /opt/ifcopenshell
          tar -C /opt -xzf ifcopenshell-prefix.tar.gz
          test -d /opt/ifcopenshell/include
          test -d /opt/ifcopenshell/lib
          test -x /opt/rocm/llvm/bin/clang++

      - name: Bazel build shared library (rocm offload)
        run: |
          bazel build //:openbimrl_native --config=rocm_offload

      - name: Stage release asset
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          src="$(find -L bazel-bin -name 'libOpenBIMRL_Native.so' -type f | head -1)"
          if [[ -z "${src}" || ! -f "${src}" ]]; then
            echo "ERROR: libOpenBIMRL_Native.so not found under bazel-bin" >&2
            find -L bazel-bin -name '*.so' 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          mkdir -p dist
          dest="dist/libOpenBimRL-Engine-Native-x86_64-rocm-${VERSION}.so"
          cp -f "${src}" "${dest}"
          ls -la "${dest}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-so-rocm
          path: dist/*.so
          if-no-files-found: error

  build-nvcc:
    needs: [version, build-ifcopenshell]
    runs-on: ubuntu-24.04
    # CUDA toolkit present for the nvcc variant. Device OpenMP offload
    # (--config=cuda_offload) stays WIP; release builds match nvcc.dockerfile
    # default (offload OFF) so CI compiles without a GPU or CUDA-capable clang.
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      CUDA_HOME: /usr/local/cuda
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Install apt dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            clang libomp-dev libomp5 \
            libboost-all-dev \
            xfonts-scalable \
            libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libxml2-dev libeigen3-dev \
            cmake ninja-build make \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev libxt-dev \
            libtbb-dev tcl-dev tk-dev occt-misc
          clang++ --version
          nvcc --version

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Download IfcOpenShell prefix
        uses: actions/download-artifact@v4
        with:
          name: ifcopenshell-prefix
          path: .

      - name: Install IfcOpenShell prefix
        run: |
          set -euo pipefail
          mkdir -p /opt
          rm -rf /opt/ifcopenshell
          tar -C /opt -xzf ifcopenshell-prefix.tar.gz
          test -d /opt/ifcopenshell/include
          test -d /opt/ifcopenshell/lib
          test -x /usr/local/cuda/bin/nvcc

      - name: Bazel build shared library (nvcc / CUDA toolkit)
        run: |
          # Toolkit on PATH via CUDA_HOME; offload config left OFF (WIP).
          bazel build //:openbimrl_native

      - name: Stage release asset
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          src="$(find -L bazel-bin -name 'libOpenBIMRL_Native.so' -type f | head -1)"
          if [[ -z "${src}" || ! -f "${src}" ]]; then
            echo "ERROR: libOpenBIMRL_Native.so not found under bazel-bin" >&2
            find -L bazel-bin -name '*.so' 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          mkdir -p dist
          dest="dist/libOpenBimRL-Engine-Native-x86_64-nvcc-${VERSION}.so"
          cp -f "${src}" "${dest}"
          ls -la "${dest}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-so-nvcc
          path: dist/*.so
          if-no-files-found: error

  release:
    needs: [version, build-llvm, build-rocm, build-nvcc, test-integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-so-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Native ${{ needs.version.outputs.value }}
          body: |
            Linux/amd64 shared libraries for OpenBimRL-Engine-Native.

            Version **${{ needs.version.outputs.value }}** (UTC calendar date, same scheme as Engine Maven GAV and ghcr image tags).

            | Asset | Variant |
            |-------|---------|
            | `libOpenBimRL-Engine-Native-x86_64-llvm-${{ needs.version.outputs.value }}.so` | System clang + libomp (CPU OpenMP) |
            | `libOpenBimRL-Engine-Native-x86_64-rocm-${{ needs.version.outputs.value }}.so` | ROCm LLVM OpenMP offload (`gfx1100` compile-only default) |
            | `libOpenBimRL-Engine-Native-x86_64-nvcc-${{ needs.version.outputs.value }}.so` | Built in CUDA devel image (toolkit present; `--config=cuda_offload` still WIP) |

            Engine JVM packaging continues to embed the stable unversioned
            `libOpenBimRL-Engine-Native-x86_64.so` inside the jar.
          files: dist/*.so
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
