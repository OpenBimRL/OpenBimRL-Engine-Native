# Native library: configure, build, and run C++ tests on Ubuntu 22.04.
# On successful main pushes, publish lib.so as a GitHub Release.
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    # Releases need write; PRs keep read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Cache native build and ccache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/openbimrl/native/cmake
          key: native-cpp-${{ hashFiles('CMakeLists.txt', '.github/workflows/cmake-test.yml') }}-ios-eafa158
          restore-keys: |
            native-cpp-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            clang \
            libboost-all-dev \
            libeigen3-dev \
            libgl1-mesa-dev \
            libgmp-dev \
            libhdf5-dev \
            libmpfr-dev \
            libocct-data-exchange-dev \
            libocct-draw-dev \
            libocct-foundation-dev \
            libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev \
            libocct-ocaf-dev \
            libocct-visualization-dev \
            libomp-dev \
            libtbb-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxmu-dev \
            libxml2-dev \
            libxt-dev \
            ninja-build \
            occt-misc \
            tcl-dev \
            tk-dev \
            xfonts-scalable
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          clang --version
          clang++ --version

      - name: Verify IFC test fixtures
        run: |
          set -euo pipefail
          for f in correct.ifc rail_test.ifc rails_parallel_gauge.ifc walls_parallel.ifc; do
            path="test/integration/resources/${f}"
            if [[ ! -f "${path}" ]]; then
              echo "::error::Missing IFC fixture: ${path}"
              exit 1
            fi
            echo "Found ${path} ($(wc -c < "${path}") bytes)"
          done

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENBIMRL_BUILD_NATIVE_TESTS=ON

      - name: Build
        run: |
          cmake --build build -j "$(nproc)" \
            --target OpenBIMRL_Native OpenBIMRL_Native_UnitTest OpenBIMRL_Native_Test

      - name: Test
        run: |
          set -euo pipefail
          # ctest returns non-zero if any discovered gtest fails → job fails.
          ctest --test-dir build --output-on-failure

      - name: Package binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -f build/libOpenBIMRL_Native.so dist/lib.so
          # Include FetchContent IfcOpenShell runtime libs when present (dynamic link).
          while IFS= read -r -d '' f; do
            cp -a "$f" dist/
          done < <(find build/_deps/ifcopenshell-build -type f \
            \( -name 'libIfcParse.so*' -o -name 'libIfcGeom.so*' \
               -o -name 'libgeometry_kernel_opencascade.so*' \) -print0 2>/dev/null || true)

          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          ARCHIVE="OpenBIMRL_Native-linux-x86_64-${TAG}.tar.gz"
          tar -C dist -czf "${ARCHIVE}" .
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh dist/ "${ARCHIVE}"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: OpenBIMRL Native ${{ steps.package.outputs.tag }}
          body: |
            Automated release from `main` after C++ tests passed.

            **Artifacts**
            - `lib.so` — JNA-loadable `OpenBIMRL_Native` shared library
            - `${{ steps.package.outputs.archive }}` — `lib.so` plus IfcOpenShell runtime `.so`s from this build (when built via FetchContent)

            **Commit:** ${{ github.sha }}
          files: |
            dist/lib.so
            ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
