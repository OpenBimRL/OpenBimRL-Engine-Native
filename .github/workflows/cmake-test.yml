# Native library: configure, build, and run C++ tests on Ubuntu 22.04.
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache native build and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/openbimrl/native/cmake
          key: native-cpp-${{ hashFiles('CMakeLists.txt') }}-ios-eafa158
          restore-keys: |
            native-cpp-

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.2
        with:
          version: "17.0.6"
          env: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            libboost-all-dev \
            libeigen3-dev \
            libgmp-dev \
            libhdf5-dev \
            libmpfr-dev \
            libocct-data-exchange-dev \
            libocct-draw-dev \
            libocct-foundation-dev \
            libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev \
            libocct-ocaf-dev \
            libocct-visualization-dev \
            libxml2-dev \
            ninja-build \
            xfonts-scalable

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENBIMRL_BUILD_NATIVE_TESTS=ON

      - name: Build
        run: cmake --build build --target OpenBIMRL_Native_Test -j "$(nproc)"

      - name: Test
        working-directory: build
        run: ./OpenBIMRL_Native_Test
