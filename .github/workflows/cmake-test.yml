# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache native build and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/openbimrl/native/cmake
          key: native-cpp-${{ hashFiles('CMakeLists.txt', 'Makefile') }}-ios-eafa158
          restore-keys: |
            native-cpp-

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.2
        with:
          version: "17.0.6"
          env: true

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y \
          xfonts-scalable libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
          libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-ocaf-dev \
          libocct-visualization-dev libboost-all-dev libhdf5-dev libgmp-dev libmpfr-dev \
          libeigen3-dev ninja-build ccache

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENBIMRL_BUILD_NATIVE_TESTS=ON

      - name: Build
        run: cmake --build build --target OpenBIMRL_Native_Test -j "$(nproc)"

      - name: Test
        working-directory: build
        run: ./OpenBIMRL_Native_Test
